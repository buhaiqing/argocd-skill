[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argocd-skill"
version = "0.5.2"
description = "ArgoCD CLI 全流程 AI Agent Skill — CLI 安装、自然语言生成命令、YAML 反向生成、诊断分析"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "buhaiqing"}]
keywords = ["argocd", "gitops", "cli", "kubernetes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scikit-learn>=1.0.0",
]

# ── Entry points ──────────────────────────────────────────────────────────────
# 安装后可直接调用（类似 kubectl 体验），无需 python -m 前缀：
#   pip install -e .
#   argocd-cli-gen --input DIR
#   argocd-api list
#   argocd-insight diagnose
#   argocd-deploy-stats
#   ulw find-pod <name>
[project.scripts]
argocd-cli-gen      = "scripts.argocd_cli_gen.cli:main"
argocd-api          = "scripts.argocd_api.__main__:main"
argocd-insight      = "scripts.argocd_insight.cli:main"
argocd-deploy-stats = "scripts.argocd_deploy_stats.stats:main"
ulw                 = "scripts.ulw.ulw:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.setuptools.package-dir]
"" = "."
